version: 2
updates:
  # Monorepo root & workspaces
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 10
    reviewers:
      - "uchkunr"
    labels:
      - "dependencies"
      - "automated"
    # Ehtiyotkorlik strategiyasi:
    # Faqat minor va patch versiyalar guruhlanadi
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Loyihani sindirib qo'ymaslik uchun barcha MAJOR versiyalar bloklanadi:
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # apps/web
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 10
    reviewers:
      - "uchkunr"
    labels:
      - "dependencies"
      - "web"
    groups:
      web-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # apps/api
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 10
    reviewers:
      - "uchkunr"
    labels:
      - "dependencies"
      - "api"
    groups:
      api-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
