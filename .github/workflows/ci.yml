name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "super-secret-jwt-key-must-be-at-least-32-chars-long"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "Dependabot PR detected: installing with --no-frozen-lockfile to sync lockfile"
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Commit updated lockfile for Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s pnpm-lock.yaml) ]]; then
            echo "pnpm-lock.yaml was updated, pushing changes to PR branch..."
            git add pnpm-lock.yaml
            git commit -m "chore(deps): sync pnpm-lock.yaml for dependabot [skip ci]"
            git push
          fi

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Check TypeScript types
        run: pnpm check-types

      - name: Lint Code
        run: pnpm lint

      - name: Build Projects
        run: pnpm build
